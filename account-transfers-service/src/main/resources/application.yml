server:
  port: 8082
spring:
  application:
    name: account-transfers-service
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/ 


opentelemetry:
  enabled: false
  traces:
    exporter: jaeger
    sampler: always_on
    jaeger:
      endpoint: http://localhost:14250
  resource:
    attributes:
      service.name: account-transfers-service
      service.version: 1.0.0