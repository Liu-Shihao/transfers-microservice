server:
  port: 8083
spring:
  application:
    name: account-service
  datasource:
    url: jdbc:mysql://localhost:3306/account_transfers_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
    username: root
    password: Lsh123456!
    driver-class-name: com.mysql.cj.jdbc.Driver
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
mybatis:
  type-aliases-package: com.lsh.account.entity
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/ 
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html